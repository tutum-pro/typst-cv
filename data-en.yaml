projects_title: "Personal Projects"

projects_intro: >
  A proving ground for validating architectural concepts in working code —
  from the domain model and integration layer through to deployment on Kubernetes.

projects:
  - name: "Tutum Platform"
    link: "tutum-pro.io"
    note: >
      An X.509 certificate distribution platform for Kubernetes and Docker — mTLS,
      AES-256-GCM encryption, automatic validity checking, CLI tooling. Around
      12k lines of code; public technical documentation, dual licence.

  - name: "L2A / Applio — leasing application platform"
    link: "www.ratovia.com"
    note: >
      Live demo. Five Go microservices built around a custom formula engine: a DSL,
      a bytecode compiler, a stack machine and a persistent cache of compiled
      programs. Content-addressed product versioning (sha256), lifecycle FSMs for
      applications and contracts, BPMN coordinator. Angular front end, deployed on
      Kubernetes.

  - name: "archirules"
    link: "github.com/tutum-pro/archirules"
    note: >
      An open method for documenting architectural decisions — registers of ADRs,
      open questions and project phases, with automated consistency checking.
      Licensed CC BY-SA 4.0.

projects_note: >
  Source code access is restricted. For recruitment purposes I can grant access
  on request and walk through the solutions in practice.

